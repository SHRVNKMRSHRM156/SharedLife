<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A large family house and a small house side by side on a lane, joined by a short garden path, with a string of marigold flowers, a tulsi plant and birds flying between the two roofs">
  <defs>
    <style>
      .bird1 { animation: fly 14s ease-in-out infinite alternate; }
      .bird2 { animation: fly 18s ease-in-out infinite alternate-reverse; }
      .lamp { animation: glow 3.5s ease-in-out infinite; }
      .lamp2 { animation: glow 3.5s ease-in-out infinite; animation-delay: 1.4s; }
      .toran { transform-origin: 250px 214px; animation: sway 6s ease-in-out infinite; }
      .cloud { animation: drift 30s ease-in-out infinite alternate; }
      @keyframes fly { from { transform: translate(0, 0); } to { transform: translate(230px, -20px); } }
      @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
      @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
      @media (prefers-reduced-motion: reduce) { .bird1, .bird2, .lamp, .lamp2, .toran, .cloud { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <circle cx="660" cy="86" r="38" fill="#EBA937"/>
  <g class="cloud" fill="#F6D5C6"><ellipse cx="420" cy="70" rx="56" ry="17"/><ellipse cx="448" cy="58" rx="32" ry="18"/></g>
  <!-- ground -->
  <path d="M0 318 Q400 296 800 318 L800 400 L0 400 Z" fill="#D6E6D9"/>
  <path d="M0 360 Q400 344 800 362 L800 400 L0 400 Z" fill="#1F4D3A"/>
  <!-- large family house -->
  <rect x="90" y="168" width="320" height="150" fill="#F6D5C6"/>
  <path d="M74 172 L250 96 L426 172 Z" fill="#C2512F"/>
  <rect x="90" y="236" width="320" height="8" fill="#1F4D3A"/>
  <rect x="110" y="184" width="44" height="40" rx="4" fill="#183A2B"/>
  <rect class="lamp" x="116" y="190" width="32" height="28" rx="3" fill="#EBA937"/>
  <rect x="346" y="184" width="44" height="40" rx="4" fill="#183A2B"/>
  <rect class="lamp2" x="352" y="190" width="32" height="28" rx="3" fill="#EBA937"/>
  <rect x="180" y="184" width="44" height="40" rx="4" fill="#183A2B"/>
  <rect x="276" y="184" width="44" height="40" rx="4" fill="#183A2B"/>
  <rect x="120" y="256" width="40" height="42" rx="4" fill="#183A2B"/>
  <rect x="340" y="256" width="40" height="42" rx="4" fill="#183A2B"/>
  <path d="M222 318 L222 262 Q250 238 278 262 L278 318 Z" fill="#1F4D3A"/>
  <!-- marigold toran over the door -->
  <g class="toran">
    <path d="M214 226 Q250 244 286 226" fill="none" stroke="#1F4D3A" stroke-width="2"/>
    <g fill="#EBA937"><circle cx="222" cy="231" r="5"/><circle cx="238" cy="237" r="5"/><circle cx="262" cy="237" r="5"/><circle cx="278" cy="231" r="5"/></g>
    <g fill="#C2512F"><circle cx="230" cy="234" r="4"/><circle cx="250" cy="239" r="5"/><circle cx="270" cy="234" r="4"/></g>
  </g>
  <!-- rangoli at the door -->
  <circle cx="250" cy="334" r="14" fill="none" stroke="#C2512F" stroke-width="3"/>
  <circle cx="250" cy="334" r="5" fill="#EBA937"/>
  <!-- small house -->
  <rect x="530" y="214" width="170" height="104" fill="#D6E6D9"/>
  <path d="M516 218 L615 160 L714 218 Z" fill="#1F4D3A"/>
  <rect x="552" y="236" width="40" height="36" rx="4" fill="#183A2B"/>
  <rect class="lamp2" x="558" y="242" width="28" height="24" rx="3" fill="#EBA937"/>
  <path d="M624 318 L624 262 Q646 244 668 262 L668 318 Z" fill="#C2512F"/>
  <!-- garden path joining the two -->
  <path d="M278 330 C380 346 520 340 624 322" fill="none" stroke="#F6D5C6" stroke-width="16" stroke-linecap="round"/>
  <g fill="#FBF6EE"><circle cx="340" cy="337" r="4"/><circle cx="420" cy="340" r="4"/><circle cx="500" cy="337" r="4"/><circle cx="570" cy="331" r="4"/></g>
  <!-- tulsi planter -->
  <rect x="450" y="290" width="34" height="30" rx="3" fill="#C2512F"/>
  <path d="M467 290 Q456 270 462 256 M467 290 Q470 266 467 250 M467 290 Q480 272 476 258" fill="none" stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"/>
  <g fill="#1F4D3A"><ellipse cx="460" cy="256" rx="6" ry="4"/><ellipse cx="467" cy="249" rx="6" ry="4"/><ellipse cx="477" cy="257" rx="6" ry="4"/></g>
  <!-- birds -->
  <g class="bird1" fill="none" stroke="#183A2B" stroke-width="3" stroke-linecap="round"><path d="M250 120 q8 -8 16 0 q8 -8 16 0"/></g>
  <g class="bird2" fill="none" stroke="#183A2B" stroke-width="3" stroke-linecap="round"><path d="M300 140 q6 -6 12 0 q6 -6 12 0"/></g>
</svg>
