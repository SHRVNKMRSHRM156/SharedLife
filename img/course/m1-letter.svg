<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A letter with a heart being sealed">
  <defs>
    <style>
      .paper { animation: slide 6s ease-in-out infinite; }
      .flap { animation: close 6s ease-in-out infinite; transform-origin: 400px 170px; transform-box: view-box; }
      .seal { animation: stamp 6s ease-in-out infinite; transform-origin: 400px 250px; transform-box: view-box; }
      @keyframes slide { 0%, 10% { transform: translateY(-90px); } 40%, 100% { transform: translateY(0); } }
      @keyframes close { 0%, 40% { transform: scaleY(-1); } 55%, 100% { transform: scaleY(1); } }
      @keyframes stamp { 0%, 58% { transform: scale(0); } 66% { transform: scale(1.25); } 72%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
      @media (prefers-reduced-motion: reduce) { .paper, .flap, .seal { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <circle cx="140" cy="300" r="50" fill="#D6E6D9"/>
  <circle cx="660" cy="100" r="40" fill="#F6D5C6"/>
  <!-- envelope back -->
  <rect x="250" y="170" width="300" height="180" rx="10" fill="#E5D3B5"/>
  <!-- letter -->
  <g class="paper">
    <rect x="280" y="150" width="240" height="170" rx="6" fill="#FFFFFF" stroke="#EADFCB" stroke-width="2"/>
    <g stroke="#C9B99B" stroke-width="5" stroke-linecap="round">
      <line x1="305" y1="185" x2="470" y2="185"/><line x1="305" y1="210" x2="495" y2="210"/><line x1="305" y1="235" x2="450" y2="235"/>
    </g>
  </g>
  <!-- envelope front -->
  <path d="M250 180 L400 270 L550 180 L550 340 a10 10 0 0 1 -10 10 H260 a10 10 0 0 1 -10 -10 Z" fill="#F2E4CB"/>
  <path d="M250 340 L370 255 M550 340 L430 255" stroke="#E5D3B5" stroke-width="4"/>
  <path class="flap" d="M250 170 L400 265 L550 170 Z" fill="#EBD8B8"/>
  <!-- wax seal heart -->
  <g class="seal">
    <circle cx="400" cy="250" r="30" fill="#C2512F"/>
    <path d="M386 246 c0 -10 14 -12 14 -2 c0 -10 14 -8 14 2 c0 12 -14 20 -14 20 s-14 -8 -14 -20z" fill="#F6D5C6"/>
  </g>
</svg>
