<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Two people side by side at a desk under a warm lamp, one writing with a fountain pen in an open booklet with five coloured tabs, the other leaning in to read, with a marigold in a glass of water">
  <defs>
    <style>
      .glow { animation: glow 6s ease-in-out infinite; }
      .halo { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 6s ease-in-out infinite; }
      .writer { transform-box: view-box; transform-origin: 320px 220px; animation: nod 5s ease-in-out infinite; }
      .reader { transform-box: view-box; transform-origin: 486px 262px; animation: lean 7s ease-in-out infinite; }
      .hand { animation: scribe 3s ease-in-out infinite; }
      .ink { stroke-dasharray: 70; animation: write 6s ease-in-out infinite; }
      .bloom { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
      .tab { transform-box: fill-box; transform-origin: 0% 50%; animation: flutter 5s ease-in-out infinite; }
      .t2 { animation-delay: -1s; } .t3 { animation-delay: -2s; } .t4 { animation-delay: -3s; } .t5 { animation-delay: -4s; }
      @keyframes glow { 0%, 100% { opacity: .12; } 50% { opacity: .24; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
      @keyframes nod { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } }
      @keyframes lean { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(-4deg); } }
      @keyframes scribe { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(8px, 1px); } }
      @keyframes write { 0% { stroke-dashoffset: 70; } 45%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 70; } }
      @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
      @keyframes flutter { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(1.15); } }
      @media (prefers-reduced-motion: reduce) { .glow, .halo, .writer, .reader, .hand, .ink, .bloom, .tab { animation: none; } .ink { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <!-- wall band and a small framed window of evening sky -->
  <rect x="0" y="150" width="800" height="100" fill="#D6E6D9" opacity=".7"/>
  <rect x="600" y="40" width="130" height="100" rx="6" fill="#1F4D3A"/>
  <rect x="610" y="50" width="110" height="80" rx="3" fill="#F6D5C6"/>
  <path d="M610 112 Q640 100 665 108 Q692 98 720 106 L720 130 L610 130 Z" fill="#2F6E54"/>
  <path d="M665 50 L665 130" stroke="#1F4D3A" stroke-width="4"/>
  <!-- lamp: base, arm and shade -->
  <ellipse cx="110" cy="270" rx="38" ry="8" fill="#183A2B"/>
  <path d="M110 266 L132 140 L196 116" fill="none" stroke="#183A2B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="132" cy="140" r="7" fill="#183A2B"/>
  <path d="M174 112 Q196 78 232 104 L258 150 Q232 168 200 172 Z" fill="#C2512F"/>
  <path d="M200 172 Q232 168 258 150" fill="none" stroke="#183A2B" stroke-width="4" stroke-linecap="round"/>
  <ellipse class="halo" cx="228" cy="166" rx="14" ry="8" fill="#FCE8BF"/>
  <!-- warm lamp light -->
  <path class="glow" d="M200 172 L258 150 L420 270 L214 270 Z" fill="#EBA937"/>
  <!-- writer, on the left, head bent over the page -->
  <g class="writer">
    <path d="M250 290 C250 214 278 186 318 186 C358 186 384 214 384 290 Z" fill="#1F4D3A"/>
    <circle cx="326" cy="148" r="36" fill="#F6D5C6"/>
    <path d="M290 146 C286 102 368 98 364 146 C352 120 304 120 290 146 Z" fill="#183A2B"/>
    <path d="M292 150 C284 170 288 186 296 192 C296 176 298 162 302 154 Z" fill="#183A2B"/>
  </g>
  <!-- reader, on the right, leaning in -->
  <g class="reader">
    <path d="M420 290 C420 214 446 190 484 190 C522 190 548 214 548 290 Z" fill="#C2512F"/>
    <circle cx="478" cy="150" r="36" fill="#F6D5C6"/>
    <path d="M440 150 C434 104 520 100 516 150 C510 126 450 124 440 150 Z" fill="#183A2B"/>
    <path d="M512 148 C524 178 522 214 510 236 C508 210 506 178 502 160 Z" fill="#183A2B"/>
    <circle cx="482" cy="112" r="10" fill="#183A2B"/>
  </g>
  <!-- desk -->
  <rect x="0" y="270" width="800" height="130" fill="#F2E4CB"/>
  <rect x="0" y="266" width="800" height="8" fill="#C2512F"/>
  <g stroke="#EBA937" stroke-width="2" opacity=".6" fill="none">
    <path d="M30 316 Q160 308 260 318"/><path d="M560 330 Q680 322 780 332"/><path d="M60 380 Q220 372 330 384"/><path d="M500 384 Q640 376 790 386"/>
  </g>
  <!-- pool of lamp light on the desk -->
  <ellipse class="glow" cx="390" cy="332" rx="230" ry="62" fill="#EBA937"/>
  <!-- open booklet with five coloured tabs -->
  <g>
    <g>
      <rect class="tab" x="540" y="292" width="18" height="12" rx="3" fill="#C2512F"/>
      <rect class="tab t2" x="540" y="308" width="18" height="12" rx="3" fill="#EBA937"/>
      <rect class="tab t3" x="540" y="324" width="18" height="12" rx="3" fill="#2F6E54"/>
      <rect class="tab t4" x="540" y="340" width="18" height="12" rx="3" fill="#9FB8A8"/>
      <rect class="tab t5" x="540" y="356" width="18" height="12" rx="3" fill="#F6D5C6" stroke="#C2512F" stroke-width="1.5"/>
    </g>
    <path d="M262 290 Q330 280 400 292 Q470 280 546 290 L546 378 Q470 368 400 380 Q330 368 262 378 Z" fill="#1F4D3A"/>
    <path d="M270 286 Q334 276 400 288 L400 374 Q334 362 270 372 Z" fill="#FFFFFF" stroke="#1F4D3A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M400 288 Q466 276 538 286 L538 372 Q466 362 400 374 Z" fill="#FFFFFF" stroke="#1F4D3A" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#D6E6D9">
      <rect x="290" y="300" width="88" height="5" rx="2.5"/><rect x="290" y="314" width="96" height="5" rx="2.5"/>
      <rect x="420" y="298" width="96" height="5" rx="2.5"/><rect x="420" y="312" width="86" height="5" rx="2.5"/>
      <rect x="420" y="326" width="96" height="5" rx="2.5"/><rect x="420" y="340" width="70" height="5" rx="2.5"/>
    </g>
    <path class="ink" d="M290 334 Q298 326 304 333 Q310 340 316 330 Q322 324 328 333 Q334 340 342 331" stroke="#183A2B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- writer's hand with a fountain pen -->
  <g class="hand">
    <path d="M362 232 Q380 300 352 344" fill="none" stroke="#1F4D3A" stroke-width="26" stroke-linecap="round"/>
    <ellipse cx="350" cy="350" rx="17" ry="12" fill="#F6D5C6"/>
    <path d="M346 354 L378 306" stroke="#183A2B" stroke-width="7" stroke-linecap="round"/>
    <path d="M366 324 L372 315" stroke="#EBA937" stroke-width="7"/>
    <path d="M346 354 L340 362" stroke="#EBA937" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- reader's hand resting on the page, with a bangle -->
  <g>
    <path d="M436 236 Q426 300 452 334" fill="none" stroke="#C2512F" stroke-width="24" stroke-linecap="round"/>
    <ellipse cx="452" cy="330" rx="7" ry="12" fill="none" stroke="#EBA937" stroke-width="4" transform="rotate(-40 452 330)"/>
    <ellipse cx="466" cy="346" rx="15" ry="10" fill="#F6D5C6"/>
  </g>
  <!-- marigold in a glass of water -->
  <g>
    <ellipse cx="680" cy="320" rx="30" ry="6" fill="#183A2B" opacity=".12"/>
    <path d="M662 254 L666 318 Q680 324 694 318 L698 254 Z" fill="#D6E6D9" stroke="#183A2B" stroke-width="2.5" opacity=".95"/>
    <path d="M665 276 L695 276" stroke="#FBF6EE" stroke-width="3" stroke-linecap="round"/>
    <g class="bloom">
      <path d="M680 314 Q676 260 682 214" stroke="#2F6E54" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M679 262 Q658 254 652 238 Q672 240 680 258 Z" fill="#2F6E54"/>
      <g transform="translate(682 206)">
        <circle r="20" fill="#EBA937"/>
        <g fill="#C2512F" opacity=".55"><path d="M-14 -6 Q-8 -16 0 -12 Q-6 -4 -14 -6 Z"/><path d="M14 -6 Q8 -16 0 -12 Q6 -4 14 -6 Z"/><path d="M-12 8 Q-4 2 0 10 Q-8 16 -12 8 Z"/><path d="M12 8 Q4 2 0 10 Q8 16 12 8 Z"/></g>
        <circle r="13" fill="#EBA937" stroke="#C2512F" stroke-width="2" stroke-dasharray="3 3"/>
        <circle r="5" fill="#C2512F"/>
      </g>
    </g>
  </g>
</svg>
