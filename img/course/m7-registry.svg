<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A couple seated at a registration desk signing a large register together, a certificate with a round seal beside them, two witnesses standing behind, and strings of marigolds hanging above">
  <defs>
    <style>
      .garland { transform-origin: 400px 0px; animation: sway 7s ease-in-out infinite; }
      .pen { transform-origin: 452px 292px; animation: write 2.4s ease-in-out infinite; }
      .seal { transform-box: fill-box; transform-origin: 50% 50%; animation: glow 3.6s ease-in-out infinite; }
      .petal { animation: fall 6s linear infinite; opacity: 0; }
      .p2 { animation-delay: 1.5s; } .p3 { animation-delay: 3s; } .p4 { animation-delay: 4.5s; }
      .nod { transform-origin: 150px 250px; animation: nod 5s ease-in-out infinite; }
      @keyframes sway { 0%, 100% { transform: rotate(-.6deg); } 50% { transform: rotate(.6deg); } }
      @keyframes write { 0%, 100% { transform: translate(0,0) rotate(0deg); } 25% { transform: translate(6px,1px) rotate(3deg); } 50% { transform: translate(12px,0) rotate(-2deg); } 75% { transform: translate(6px,-1px) rotate(2deg); } }
      @keyframes glow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes fall { 0% { opacity: 0; transform: translate(0,0) rotate(0deg); } 15% { opacity: .9; } 85% { opacity: .7; } 100% { opacity: 0; transform: translate(18px,170px) rotate(160deg); } }
      @keyframes nod { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-2deg); } }
      @media (prefers-reduced-motion: reduce) { .garland, .pen, .seal, .petal, .nod { animation: none; } .petal { opacity: .7; } }
    </style>
