<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="An open jewellery box with a necklace and bangles beside a small notebook with a pen, a house with two keys hanging on one ring, and a pair of balanced scales gently settling level">
  <defs>
    <style>
      .beam { transform-origin: 668px 150px; animation: level 12s ease-in-out infinite; }
      .panL { animation: panL 12s ease-in-out infinite; }
      .panR { animation: panR 12s ease-in-out infinite; }
      .keys { transform-origin: 512px 236px; animation: swing 6s ease-in-out infinite; }
      .spark1 { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 3s ease-in-out infinite; }
      .spark2 { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 3s ease-in-out infinite; animation-delay: 1s; }
      .spark3 { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 3s ease-in-out infinite; animation-delay: 2s; }
      .lamp { animation: glow 3.5s ease-in-out infinite; }
      .cloud { animation: drift 30s ease-in-out infinite alternate; }
      @keyframes level { 0% { transform: rotate(5deg); } 30% { transform: rotate(-2deg); } 50% { transform: rotate(.8deg); } 65%, 88% { transform: rotate(0deg); } 100% { transform: rotate(5deg); } }
      @keyframes panL { 0% { transform: translateY(-6.8px); } 30% { transform: translateY(2.7px); } 50% { transform: translateY(-1.1px); } 65%, 88% { transform: translateY(0); } 100% { transform: translateY(-6.8px); } }
      @keyframes panR { 0% { transform: translateY(6.8px); } 30% { transform: translateY(-2.7px); } 50% { transform: translateY(1.1px); } 65%, 88% { transform: translateY(0); } 100% { transform: translateY(6.8px); } }
      @keyframes swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
      @media (prefers-reduced-motion: reduce) { .beam, .panL, .panR, .keys, .spark1, .spark2, .spark3, .lamp, .cloud { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <circle cx="400" cy="70" r="34" fill="#EBA937"/>
  <g class="cloud" fill="#F6D5C6"><ellipse cx="180" cy="74" rx="56" ry="17"/><ellipse cx="208" cy="62" rx="32" ry="18"/></g>
  <!-- ground -->
  <path d="M0 318 Q400 296 800 318 L800 400 L0 400 Z" fill="#D6E6D9"/>
  <path d="M0 360 Q400 344 800 362 L800 400 L0 400 Z" fill="#1F4D3A"/>

  <!-- low table under the box and notebook -->
  <rect x="44" y="300" width="290" height="14" rx="4" fill="#1F4D3A"/>
  <rect x="62" y="314" width="12" height="36" rx="3" fill="#183A2B"/>
  <rect x="304" y="314" width="12" height="36" rx="3" fill="#183A2B"/>

  <!-- jewellery box: open lid, velvet inside, necklace and bangles -->
  <path d="M70 226 L86 150 L226 150 L210 226 Z" fill="#C2512F"/>
  <path d="M84 220 L96 162 L216 162 L204 220 Z" fill="#F6D5C6"/>
  <rect x="64" y="226" width="152" height="74" rx="6" fill="#C2512F"/>
  <rect x="74" y="226" width="132" height="18" fill="#F6D5C6"/>
  <rect x="64" y="252" width="152" height="6" fill="#183A2B" opacity=".25"/>
  <rect x="132" y="262" width="16" height="12" rx="3" fill="#EBA937"/>
  <!-- necklace draped on the lid velvet -->
  <path d="M112 172 Q156 226 200 172" fill="none" stroke="#EBA937" stroke-width="3"/>
  <g fill="#EBA937"><circle cx="122" cy="186" r="4"/><circle cx="134" cy="198" r="4"/><circle cx="148" cy="204" r="4"/><circle cx="164" cy="204" r="4"/><circle cx="178" cy="198" r="4"/><circle cx="190" cy="186" r="4"/></g>
  <path d="M156 206 L164 216 L156 226 L148 216 Z" fill="#1F4D3A"/>
  <!-- bangles resting in the tray -->
  <g fill="none" stroke="#EBA937" stroke-width="5"><ellipse cx="104" cy="234" rx="18" ry="7"/><ellipse cx="112" cy="230" rx="18" ry="7"/></g>
  <ellipse cx="176" cy="234" rx="18" ry="7" fill="none" stroke="#1F4D3A" stroke-width="5"/>
  <!-- sparkles -->
  <path class="spark1" d="M210 136 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z" fill="#EBA937"/>
  <path class="spark2" d="M92 128 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" fill="#EBA937"/>
  <path class="spark3" d="M150 120 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" fill="#C2512F"/>

  <!-- notebook list with pen -->
  <g transform="rotate(-6 282 270)">
    <rect x="236" y="236" width="92" height="64" rx="4" fill="#FBF6EE" stroke="#1F4D3A" stroke-width="3"/>
    <rect x="236" y="236" width="12" height="64" fill="#1F4D3A"/>
    <g stroke="#C2512F" stroke-width="3" stroke-linecap="round"><path d="M258 252 L262 252"/><path d="M258 266 L262 266"/><path d="M258 280 L262 280"/></g>
    <g stroke="#183A2B" stroke-width="3" stroke-linecap="round" opacity=".55"><path d="M270 252 L314 252"/><path d="M270 266 L306 266"/><path d="M270 280 L316 280"/></g>
  </g>
  <g transform="rotate(30 330 262)">
    <rect x="300" y="258" width="62" height="8" rx="4" fill="#EBA937"/>
    <path d="M362 258 L374 262 L362 266 Z" fill="#183A2B"/>
  </g>

  <!-- house -->
  <rect x="388" y="206" width="148" height="112" fill="#F6D5C6"/>
  <path d="M372 210 L462 146 L552 210 Z" fill="#1F4D3A"/>
  <rect x="408" y="226" width="36" height="34" rx="4" fill="#183A2B"/>
  <rect class="lamp" x="413" y="231" width="26" height="24" rx="3" fill="#EBA937"/>
  <path d="M446 318 L446 270 Q466 252 486 270 L486 318 Z" fill="#C2512F"/>
  <circle cx="478" cy="296" r="3" fill="#EBA937"/>
  <!-- doorstep -->
  <rect x="438" y="318" width="56" height="8" rx="3" fill="#1F4D3A"/>
  <!-- two keys on one ring, hanging from a small hook beside the door -->
  <circle cx="512" cy="234" r="3.5" fill="#183A2B"/>
  <g class="keys">
    <circle cx="512" cy="248" r="11" fill="none" stroke="#183A2B" stroke-width="3"/>
    <g transform="rotate(16 512 258)">
      <circle cx="512" cy="270" r="9" fill="#EBA937"/>
      <circle cx="512" cy="270" r="3" fill="#F6D5C6"/>
      <rect x="508.5" y="277" width="7" height="32" rx="2" fill="#EBA937"/>
      <rect x="515" y="297" width="7" height="5" fill="#EBA937"/><rect x="515" y="304" width="5" height="5" fill="#EBA937"/>
    </g>
    <g transform="rotate(-16 512 258)">
      <circle cx="512" cy="270" r="9" fill="#C2512F"/>
      <circle cx="512" cy="270" r="3" fill="#F6D5C6"/>
      <rect x="508.5" y="277" width="7" height="32" rx="2" fill="#C2512F"/>
      <rect x="502" y="297" width="7" height="5" fill="#C2512F"/><rect x="504" y="304" width="5" height="5" fill="#C2512F"/>
    </g>
  </g>
  <!-- small plant by the house -->
  <rect x="546" y="294" width="26" height="24" rx="3" fill="#C2512F"/>
  <path d="M559 294 Q550 278 554 266 M559 294 Q562 274 559 262 M559 294 Q570 280 567 268" fill="none" stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"/>

  <!-- balanced scales -->
  <rect x="618" y="312" width="100" height="12" rx="4" fill="#1F4D3A"/>
  <path d="M648 312 L668 292 L688 312 Z" fill="#1F4D3A"/>
  <rect x="664" y="150" width="8" height="150" rx="3" fill="#183A2B"/>
  <circle cx="668" cy="142" r="8" fill="#EBA937"/>
  <!-- left pan -->
  <g class="panL">
    <g fill="none" stroke="#183A2B" stroke-width="2"><path d="M590 150 L566 222"/><path d="M590 150 L614 222"/></g>
    <path d="M558 222 L622 222 Q614 244 590 244 Q566 244 558 222 Z" fill="#C2512F"/>
    <g fill="#EBA937"><ellipse cx="590" cy="216" rx="14" ry="4"/><ellipse cx="590" cy="210" rx="14" ry="4"/><ellipse cx="590" cy="204" rx="14" ry="4"/></g>
  </g>
  <!-- right pan -->
  <g class="panR">
    <g fill="none" stroke="#183A2B" stroke-width="2"><path d="M746 150 L722 222"/><path d="M746 150 L770 222"/></g>
    <path d="M714 222 L778 222 Q770 244 746 244 Q722 244 714 222 Z" fill="#1F4D3A"/>
    <g fill="#EBA937"><ellipse cx="746" cy="216" rx="14" ry="4"/><ellipse cx="746" cy="210" rx="14" ry="4"/><ellipse cx="746" cy="204" rx="14" ry="4"/></g>
  </g>
  <!-- beam on top so the strings meet under it -->
  <g class="beam">
    <rect x="586" y="146" width="164" height="8" rx="4" fill="#183A2B"/>
    <circle cx="590" cy="150" r="5" fill="#EBA937"/>
    <circle cx="746" cy="150" r="5" fill="#EBA937"/>
  </g>
</svg>
