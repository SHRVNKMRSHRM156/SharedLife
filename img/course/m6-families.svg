<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A small home in the middle with its own garden, and two family homes on either side, each joined to it by a string of glowing lights and a path of equal length, with diyas lit at every doorstep">
  <defs>
    <style>
      .bulb { animation: twinkle 3s ease-in-out infinite; }
      .b2 { animation-delay: .8s; }
      .b3 { animation-delay: 1.6s; }
      .b4 { animation-delay: 2.4s; }
      .diya { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.8s ease-in-out infinite alternate; }
      .moon { animation: float 10s ease-in-out infinite alternate; }
      @keyframes twinkle { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes flick { from { transform: scale(.85, .8); } to { transform: scale(1.05, 1.15); } }
      @keyframes float { from { transform: translateY(6px); } to { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .bulb, .diya, .moon { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <circle class="moon" cx="400" cy="62" r="28" fill="#EBA937"/>
  <!-- ground -->
  <path d="M0 300 Q400 280 800 300 L800 400 L0 400 Z" fill="#D6E6D9"/>
  <path d="M0 352 Q400 336 800 352 L800 400 L0 400 Z" fill="#1F4D3A"/>
  <!-- left family home -->
  <rect x="40" y="178" width="150" height="124" fill="#F6D5C6"/>
  <path d="M28 182 L115 122 L202 182 Z" fill="#1F4D3A"/>
  <rect x="62" y="200" width="34" height="32" rx="4" fill="#183A2B"/>
  <rect x="134" y="200" width="34" height="32" rx="4" fill="#183A2B"/>
  <path d="M96 302 L96 256 Q115 240 134 256 L134 302 Z" fill="#C2512F"/>
  <!-- right family home -->
  <rect x="610" y="178" width="150" height="124" fill="#F6D5C6"/>
  <path d="M598 182 L685 122 L772 182 Z" fill="#C2512F"/>
  <rect x="632" y="200" width="34" height="32" rx="4" fill="#183A2B"/>
  <rect x="704" y="200" width="34" height="32" rx="4" fill="#183A2B"/>
  <path d="M666 302 L666 256 Q685 240 704 256 L704 302 Z" fill="#1F4D3A"/>
  <!-- couple's home in the middle -->
  <rect x="330" y="196" width="140" height="106" fill="#D6E6D9" stroke="#1F4D3A" stroke-width="3"/>
  <path d="M316 200 L400 140 L484 200 Z" fill="#EBA937"/>
  <rect x="350" y="216" width="32" height="30" rx="4" fill="#183A2B"/>
  <rect x="418" y="216" width="32" height="30" rx="4" fill="#183A2B"/>
  <path d="M382 302 L382 262 Q400 248 418 262 L418 302 Z" fill="#183A2B"/>
  <!-- small garden around the middle home -->
  <g fill="#1F4D3A"><circle cx="322" cy="292" r="14"/><circle cx="478" cy="292" r="14"/></g>
  <g fill="#C2512F"><circle cx="318" cy="286" r="4"/><circle cx="482" cy="286" r="4"/></g>
  <!-- strings of lights, equal on both sides -->
  <path d="M190 186 Q260 226 330 204" fill="none" stroke="#183A2B" stroke-width="2"/>
  <path d="M470 204 Q540 226 610 186" fill="none" stroke="#183A2B" stroke-width="2"/>
  <g fill="#EBA937">
    <circle class="bulb" cx="214" cy="200" r="6"/><circle class="bulb b2" cx="244" cy="211" r="6"/><circle class="bulb b3" cx="276" cy="214" r="6"/><circle class="bulb b4" cx="306" cy="210" r="6"/>
    <circle class="bulb b4" cx="494" cy="210" r="6"/><circle class="bulb b3" cx="524" cy="214" r="6"/><circle class="bulb b2" cx="556" cy="211" r="6"/><circle class="bulb" cx="586" cy="200" r="6"/>
  </g>
  <!-- paths of equal length -->
  <path d="M134 318 Q258 334 382 318" fill="none" stroke="#F6D5C6" stroke-width="12" stroke-linecap="round"/>
  <path d="M418 318 Q542 334 666 318" fill="none" stroke="#F6D5C6" stroke-width="12" stroke-linecap="round"/>
  <!-- diyas at each door -->
  <g>
    <path d="M100 312 Q115 324 130 312 Z" fill="#C2512F"/><path class="diya" d="M115 312 Q109 302 115 294 Q121 302 115 312 Z" fill="#EBA937"/>
    <path d="M385 312 Q400 324 415 312 Z" fill="#C2512F"/><path class="diya" d="M400 312 Q394 302 400 294 Q406 302 400 312 Z" fill="#EBA937"/>
    <path d="M670 312 Q685 324 700 312 Z" fill="#C2512F"/><path class="diya" d="M685 312 Q679 302 685 294 Q691 302 685 312 Z" fill="#EBA937"/>
  </g>
</svg>
