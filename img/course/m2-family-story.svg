<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Two family trees whose branches meet over a small new home">
  <rect width="800" height="400" fill="#FBF6EE"/>
  <circle cx="400" cy="70" r="34" fill="#EBA937"/>
  <rect y="330" width="800" height="70" fill="#D6E6D9"/>
  <path d="M0 330 Q400 300 800 330" fill="none" stroke="#1F4D3A" stroke-width="4" opacity=".4"/>
  <!-- left tree -->
  <path d="M190 332 C190 280 186 240 196 200 C206 170 230 150 270 140" fill="none" stroke="#183A2B" stroke-width="16" stroke-linecap="round"/>
  <path d="M194 250 C170 230 150 225 130 228" fill="none" stroke="#183A2B" stroke-width="9" stroke-linecap="round"/>
  <path d="M196 205 C230 205 268 190 300 170" fill="none" stroke="#183A2B" stroke-width="8" stroke-linecap="round"/>
  <circle cx="180" cy="150" r="70" fill="#1F4D3A"/>
  <circle cx="120" cy="210" r="42" fill="#1F4D3A"/>
  <circle cx="265" cy="128" r="48" fill="#183A2B"/>
  <g fill="#EBA937"><circle cx="160" cy="130" r="8"/><circle cx="205" cy="170" r="8"/><circle cx="118" cy="205" r="7"/><circle cx="270" cy="120" r="7"/></g>
  <!-- right tree -->
  <path d="M610 332 C610 280 614 240 604 200 C594 170 570 150 530 140" fill="none" stroke="#183A2B" stroke-width="16" stroke-linecap="round"/>
  <path d="M606 250 C630 230 650 225 670 228" fill="none" stroke="#183A2B" stroke-width="9" stroke-linecap="round"/>
  <path d="M604 205 C570 205 532 190 500 170" fill="none" stroke="#183A2B" stroke-width="8" stroke-linecap="round"/>
  <circle cx="620" cy="150" r="70" fill="#C2512F"/>
  <circle cx="680" cy="210" r="42" fill="#C2512F"/>
  <circle cx="535" cy="128" r="48" fill="#EBA937"/>
  <g fill="#F6D5C6"><circle cx="640" cy="130" r="8"/><circle cx="595" cy="170" r="8"/><circle cx="682" cy="205" r="7"/><circle cx="530" cy="120" r="7"/></g>
  <!-- meeting point -->
  <circle cx="400" cy="150" r="30" fill="#F6D5C6"/>
  <circle cx="388" cy="150" r="14" fill="#1F4D3A"/>
  <circle cx="412" cy="150" r="14" fill="#C2512F"/>
  <!-- small home -->
  <path d="M340 260 L400 210 L460 260 Z" fill="#C2512F"/>
  <rect x="352" y="258" width="96" height="74" fill="#F6D5C6"/>
  <rect x="388" y="290" width="24" height="42" rx="3" fill="#183A2B"/>
  <rect x="362" y="272" width="18" height="16" rx="2" fill="#EBA937"/>
  <rect x="420" y="272" width="18" height="16" rx="2" fill="#EBA937"/>
  <!-- roots -->
  <path d="M190 332 C210 350 260 356 320 350" fill="none" stroke="#1F4D3A" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <path d="M610 332 C590 350 540 356 480 350" fill="none" stroke="#C2512F" stroke-width="5" stroke-linecap="round" opacity=".6"/>
</svg>
