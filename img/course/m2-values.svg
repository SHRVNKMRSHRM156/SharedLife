<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A compass whose needle settles on what matters most">
  <defs>
    <style>
      .needle { transform-origin: 400px 200px; animation: settle 7s ease-in-out infinite; }
      .glow { transform-origin: 400px 200px; animation: pulse 3.5s ease-in-out infinite; }
      .star { animation: twinkle 4s ease-in-out infinite; }
      .s2 { animation-delay: 1.2s; } .s3 { animation-delay: 2.4s; }
      @keyframes settle { 0%, 100% { transform: rotate(-14deg); } 30% { transform: rotate(10deg); } 55% { transform: rotate(-4deg); } 75% { transform: rotate(2deg); } }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.06); opacity: .8; } }
      @keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .needle, .glow, .star { animation: none; } .glow { opacity: .6; } .star { opacity: .8; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <path d="M0 320 Q200 280 400 320 T800 310 V400 H0 Z" fill="#D6E6D9"/>
  <path d="M0 350 Q220 320 420 350 T800 345 V400 H0 Z" fill="#1F4D3A" opacity=".18"/>
  <circle class="glow" cx="400" cy="200" r="150" fill="#F6D5C6"/>
  <circle cx="400" cy="200" r="120" fill="#FBF6EE" stroke="#183A2B" stroke-width="8"/>
  <circle cx="400" cy="200" r="98" fill="none" stroke="#D6E6D9" stroke-width="4"/>
  <g fill="#1F4D3A">
    <rect x="396" y="92" width="8" height="18" rx="3"/>
    <rect x="396" y="290" width="8" height="18" rx="3"/>
    <rect x="292" y="196" width="18" height="8" rx="3"/>
    <rect x="490" y="196" width="18" height="8" rx="3"/>
  </g>
  <g fill="#EBA937">
    <circle cx="331" cy="131" r="5"/><circle cx="469" cy="131" r="5"/><circle cx="331" cy="269" r="5"/><circle cx="469" cy="269" r="5"/>
  </g>
  <g class="needle">
    <path d="M400 112 L416 200 L384 200 Z" fill="#C2512F"/>
    <path d="M400 288 L416 200 L384 200 Z" fill="#1F4D3A"/>
  </g>
  <circle cx="400" cy="200" r="12" fill="#EBA937" stroke="#183A2B" stroke-width="4"/>
  <path class="star" d="M140 90 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8 Z" fill="#EBA937"/>
  <path class="star s2" d="M650 70 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#C2512F"/>
  <path class="star s3" d="M680 210 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5 Z" fill="#EBA937"/>
  <circle cx="150" cy="250" r="22" fill="#1F4D3A"/>
  <circle cx="190" cy="262" r="14" fill="#C2512F"/>
  <circle cx="610" cy="262" r="18" fill="#EBA937"/>
  <circle cx="645" cy="270" r="11" fill="#183A2B"/>
</svg>
