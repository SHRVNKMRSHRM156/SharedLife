<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A warm home kitchen with a whistling pressure cooker on the stove, two steel tumblers of tea, a broom by the wall, a hanging basket of vegetables and a wall chart of coloured squares shared between two people">
  <defs>
    <style>
      .steam1 { animation: puff 4s ease-in-out infinite; }
      .steam2 { animation: puff 4s ease-in-out infinite; animation-delay: 1.3s; }
      .steam3 { animation: puff 4s ease-in-out infinite; animation-delay: 2.6s; }
      .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.6s ease-in-out infinite alternate; }
      .basket { transform-origin: 640px 40px; animation: swing 7s ease-in-out infinite; }
      @keyframes puff { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-34px); } }
      @keyframes flick { from { transform: scaleY(.85); } to { transform: scaleY(1.1); } }
      @keyframes swing { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
      @media (prefers-reduced-motion: reduce) { .steam1, .steam2, .steam3, .flame, .basket { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <!-- wall tiles band -->
  <rect x="0" y="196" width="800" height="70" fill="#D6E6D9"/>
  <g fill="#FBF6EE" opacity=".6"><rect x="40" y="206" width="50" height="22" rx="3"/><rect x="110" y="236" width="50" height="22" rx="3"/><rect x="560" y="206" width="50" height="22" rx="3"/><rect x="680" y="236" width="50" height="22" rx="3"/></g>
  <!-- counter -->
  <rect x="0" y="266" width="800" height="22" fill="#1F4D3A"/>
  <rect x="0" y="288" width="800" height="112" fill="#183A2B"/>
  <g fill="#1F4D3A"><rect x="40" y="306" width="160" height="78" rx="6"/><rect x="230" y="306" width="160" height="78" rx="6"/><rect x="420" y="306" width="160" height="78" rx="6"/><rect x="610" y="306" width="160" height="78" rx="6"/></g>
  <g fill="#EBA937"><circle cx="186" cy="345" r="5"/><circle cx="376" cy="345" r="5"/><circle cx="566" cy="345" r="5"/><circle cx="756" cy="345" r="5"/></g>
  <!-- shared chart on the wall: two columns of squares -->
  <rect x="70" y="40" width="190" height="136" rx="8" fill="#F6D5C6"/>
  <g fill="#C2512F"><rect x="90" y="58" width="34" height="22" rx="4"/><rect x="134" y="90" width="34" height="22" rx="4"/><rect x="90" y="122" width="34" height="22" rx="4"/><rect x="178" y="122" width="34" height="22" rx="4"/></g>
  <g fill="#1F4D3A"><rect x="134" y="58" width="34" height="22" rx="4"/><rect x="178" y="58" width="34" height="22" rx="4"/><rect x="90" y="90" width="34" height="22" rx="4"/><rect x="134" y="122" width="34" height="22" rx="4"/></g>
  <g fill="#EBA937"><rect x="178" y="90" width="34" height="22" rx="4"/><rect x="222" y="58" width="22" height="86" rx="4"/></g>
  <!-- stove and cooker -->
  <rect x="330" y="246" width="170" height="20" rx="4" fill="#183A2B"/>
  <path class="flame" d="M396 246 Q402 232 408 246 Z" fill="#EBA937"/>
  <path class="flame" d="M420 246 Q426 230 432 246 Z" fill="#C2512F"/>
  <ellipse cx="414" cy="238" rx="56" ry="8" fill="#183A2B"/>
  <path d="M362 238 L370 186 Q414 172 458 186 L466 238 Z" fill="#D6E6D9" stroke="#1F4D3A" stroke-width="3"/>
  <rect x="384" y="174" width="60" height="10" rx="4" fill="#1F4D3A"/>
  <rect x="444" y="176" width="70" height="8" rx="4" fill="#183A2B"/>
  <rect x="408" y="160" width="12" height="16" rx="3" fill="#183A2B"/>
  <g fill="#D6E6D9" stroke="#1F4D3A" stroke-width="1.5">
    <circle class="steam1" cx="414" cy="146" r="10"/>
    <circle class="steam2" cx="402" cy="128" r="8"/>
    <circle class="steam3" cx="424" cy="112" r="7"/>
  </g>
  <!-- two tumblers of chai -->
  <path d="M560 266 L564 228 L588 228 L592 266 Z" fill="#D6E6D9" stroke="#1F4D3A" stroke-width="3"/>
  <rect x="566" y="232" width="20" height="8" fill="#C2512F" opacity=".7"/>
  <path d="M602 266 L606 228 L630 228 L634 266 Z" fill="#D6E6D9" stroke="#1F4D3A" stroke-width="3"/>
  <rect x="608" y="232" width="20" height="8" fill="#C2512F" opacity=".7"/>
  <!-- hanging vegetable basket -->
  <g class="basket">
    <path d="M640 0 L640 40 M640 40 L606 90 M640 40 L674 90" stroke="#1F4D3A" stroke-width="3" fill="none"/>
    <path d="M600 90 L680 90 Q676 128 640 130 Q604 128 600 90 Z" fill="#EBA937"/>
    <circle cx="624" cy="86" r="12" fill="#C2512F"/>
    <circle cx="648" cy="82" r="10" fill="#1F4D3A"/>
    <ellipse cx="664" cy="88" rx="10" ry="7" fill="#F6D5C6"/>
  </g>
  <!-- broom by the wall -->
  <path d="M740 100 L746 266" stroke="#C2512F" stroke-width="5" stroke-linecap="round"/>
  <path d="M730 210 L760 210 L772 266 L718 266 Z" fill="#EBA937"/>
  <!-- mortar and pestle -->
  <path d="M230 266 Q228 238 262 238 Q296 238 294 266 Z" fill="#1F4D3A"/>
  <path d="M270 236 L290 210" stroke="#183A2B" stroke-width="8" stroke-linecap="round"/>
</svg>
