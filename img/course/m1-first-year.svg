<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A path through the four seasons of the first year">
  <defs>
    <style>
      .walk { animation: walk 10s linear infinite; }
      @keyframes walk { from { offset-distance: 0%; } to { offset-distance: 100%; } }
      .walk { offset-path: path('M40 330 C 160 330, 180 200, 300 210 S 480 330, 560 250 S 700 120, 770 130'); }
      @media (prefers-reduced-motion: reduce) { .walk { animation: none; offset-distance: 60%; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <!-- four season panels -->
  <rect x="0" y="0" width="200" height="400" fill="#F6D5C6" opacity=".55"/>
  <rect x="200" y="0" width="200" height="400" fill="#FCE8BF" opacity=".7"/>
  <rect x="400" y="0" width="200" height="400" fill="#D6E6D9" opacity=".8"/>
  <rect x="600" y="0" width="200" height="400" fill="#E3EEF2"/>
  <!-- spring: blossoms -->
  <g fill="#C2512F"><circle cx="70" cy="90" r="10"/><circle cx="100" cy="70" r="8"/><circle cx="130" cy="100" r="10"/><circle cx="95" cy="115" r="7"/></g>
  <rect x="96" y="120" width="8" height="70" fill="#7A5236"/>
  <!-- summer: sun -->
  <circle cx="300" cy="90" r="34" fill="#EBA937"/>
  <g stroke="#EBA937" stroke-width="6" stroke-linecap="round">
    <line x1="300" y1="36" x2="300" y2="20"/><line x1="300" y1="144" x2="300" y2="160"/><line x1="246" y1="90" x2="230" y2="90"/><line x1="354" y1="90" x2="370" y2="90"/>
  </g>
  <!-- monsoon: clouds and rain -->
  <g fill="#9FB8A8"><circle cx="480" cy="80" r="26"/><circle cx="512" cy="70" r="32"/><circle cx="545" cy="84" r="24"/><rect x="470" y="80" width="90" height="26" rx="13"/></g>
  <g stroke="#1F4D3A" stroke-width="4" stroke-linecap="round"><line x1="485" y1="122" x2="478" y2="140"/><line x1="512" y1="122" x2="505" y2="140"/><line x1="540" y1="122" x2="533" y2="140"/></g>
  <!-- winter: diya / warm lamp -->
  <path d="M670 110 q30 30 60 0 q-6 22 -30 24 q-24 -2 -30 -24z" fill="#C2512F"/>
  <path d="M700 106 c-10 -14 0 -30 0 -36 c8 10 14 22 0 36z" fill="#EBA937"/>
  <!-- path -->
  <path d="M40 330 C 160 330, 180 200, 300 210 S 480 330, 560 250 S 700 120, 770 130" fill="none" stroke="#183A2B" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/>
  <!-- two walkers -->
  <g class="walk">
    <circle cx="-9" cy="-34" r="9" fill="#C2512F"/><rect x="-16" y="-24" width="14" height="26" rx="7" fill="#C2512F"/>
    <circle cx="9" cy="-36" r="9" fill="#1F4D3A"/><rect x="2" y="-26" width="14" height="28" rx="7" fill="#1F4D3A"/>
  </g>
</svg>
