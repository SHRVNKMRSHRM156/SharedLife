<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Two speech bubbles taking turns, with small cards of questions between them">
  <defs>
    <style>
      .dot { animation: blink 1.8s ease-in-out infinite; }
      .d2 { animation-delay: .3s; } .d3 { animation-delay: .6s; }
      .b1 { animation: float 6s ease-in-out infinite; }
      .b2 { animation: float 6s ease-in-out infinite; animation-delay: 3s; }
      .card { animation: float 5s ease-in-out infinite; }
      .c2 { animation-delay: 1.6s; } .c3 { animation-delay: 3.2s; }
      @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .dot, .b1, .b2, .card { animation: none; } .dot { opacity: .9; } }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FBF6EE"/>
  <rect x="0" y="330" width="800" height="70" fill="#D6E6D9"/>
  <g class="b1">
    <rect x="90" y="70" width="260" height="140" rx="40" fill="#1F4D3A"/>
    <path d="M150 205 L130 260 L200 208 Z" fill="#1F4D3A"/>
    <circle class="dot" cx="170" cy="140" r="14" fill="#FBF6EE"/>
    <circle class="dot d2" cx="220" cy="140" r="14" fill="#FBF6EE"/>
    <circle class="dot d3" cx="270" cy="140" r="14" fill="#FBF6EE"/>
  </g>
  <g class="b2">
    <rect x="450" y="120" width="260" height="140" rx="40" fill="#C2512F"/>
    <path d="M650 255 L670 310 L600 258 Z" fill="#C2512F"/>
    <circle class="dot d3" cx="530" cy="190" r="14" fill="#FBF6EE"/>
    <circle class="dot d2" cx="580" cy="190" r="14" fill="#FBF6EE"/>
    <circle class="dot" cx="630" cy="190" r="14" fill="#FBF6EE"/>
  </g>
  <g class="card"><rect x="330" y="270" width="60" height="44" rx="8" fill="#EBA937"/><rect x="342" y="284" width="36" height="6" rx="3" fill="#FBF6EE"/><rect x="342" y="296" width="24" height="6" rx="3" fill="#FBF6EE"/></g>
  <g class="card c2"><rect x="410" y="285" width="60" height="44" rx="8" fill="#F6D5C6"/><rect x="422" y="299" width="36" height="6" rx="3" fill="#C2512F"/><rect x="422" y="311" width="24" height="6" rx="3" fill="#C2512F"/></g>
  <g class="card c3"><rect x="250" y="290" width="60" height="44" rx="8" fill="#183A2B"/><rect x="262" y="304" width="36" height="6" rx="3" fill="#EBA937"/><rect x="262" y="316" width="24" height="6" rx="3" fill="#EBA937"/></g>
  <circle cx="740" cy="70" r="20" fill="#EBA937"/>
  <circle cx="60" cy="300" r="14" fill="#F6D5C6"/>
</svg>
